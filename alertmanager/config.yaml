global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "env"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: ops
  routes:
    - matchers: [severity = "critical"]
      receiver: ops-critical
      continue: true

receivers:
  - name: ops
    webhook_configs:
      - url: http://example.com/hooks/ops
        send_resolved: true

  - name: ops-critical
    webhook_configs:
      - url: http://example.com/hooks/ops-critical
        send_resolved: true
    # Add real channels, e.g.:
    # email_configs:
    #   - to: ops@example.com
    #     from: alertmanager@example.com
    #     smarthost: smtp.example.com:587
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/slack_url
    #     channel: "#ops-critical"

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ["alertname", "instance"]
