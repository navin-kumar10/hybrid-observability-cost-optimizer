global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: on-prem
    replica: single-node-starter

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888", "otel-collector:8889"]

  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:14269"]

  # Remote / on-prem node exporters (TLS + basic auth). Replace with real hosts.
  # - job_name: nodes-remote
  #   scheme: https
  #   tls_config:
  #     ca_file: /etc/prometheus/certs/ca.crt
  #     cert_file: /etc/prometheus/certs/client.crt
  #     key_file: /etc/prometheus/certs/client.key
  #     insecure_skip_verify: false
  #   basic_auth:
  #     username: prometheus
  #     password_file: /etc/prometheus/secrets/scrape_password
  #   static_configs:
  #     - targets: ["node-01.example.internal:9100", "node-02.example.internal:9100"]
  #       labels: { env: prod }

  # Kubernetes (when Prometheus runs inside the cluster use kubernetes_sd_configs).
  # Kept as static placeholder for this starter.
  - job_name: kubernetes-placeholders
    static_configs:
      - targets: ["kube-state-metrics:8080", "node-exporter:9100"]
        labels: { env: prod }
